name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'

      - name: Install VLC SDK
        run: |
          echo "VLC_SDK_PATH=${{ github.workspace }}\vlc_extracted\vlc-3.0.21" >> $env:GITHUB_ENV
          choco install vlc -y --no-progress
          echo "VLC_BIN_PATH=C:\Program Files\VideoLAN\VLC" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Bundle Python (Windows)
        run: |
          $pyVer = "3.12.8"
          $pyUrl = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
          Write-Host "Downloading Python $pyVer embeddable..."
          Invoke-WebRequest -Uri $pyUrl -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "build\Release\python"
          Remove-Item "python-embed.zip"

          $pthFile = "build\Release\python\python312._pth"
          $content = Get-Content -Path $pthFile -Raw
          $content = $content -replace "# import site", "import site"
          Set-Content -Path $pthFile -Value $content -NoNewline

          $targetDir = "${{ github.workspace }}\build\Release\python\Lib\site-packages"
          python -m pip install opencv-python-headless numpy --target "$targetDir" --no-warn-script-location
          Write-Host "Python bundled successfully"
        shell: pwsh

      - name: Configure CMake
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release
        shell: bash

      - name: Create Windows package
        run: |
          Copy-Item "setup_python_deps.bat" "build\Release\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "build\Release\*" -DestinationPath "LumenArc-${{ github.ref_name }}-win64.zip"
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: LumenArc-${{ github.ref_name }}-win64.zip

  build-macos-intel:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtcharts'

      - name: Install VLC
        run: brew install vlc
        shell: bash

      - name: Bundle Python (Intel)
        run: |
          curl -L "https://github.com/astral-sh/python-build-standalone/releases/download/20260602/cpython-3.12.13+20260602-x86_64-apple-darwin-install_only_stripped.tar.gz" -o python.tar.gz

          APP_PATH="build/Release/LumenArc.app"
          PYTHON_DIR="$APP_PATH/Contents/MacOS/python"
          mkdir -p "$PYTHON_DIR"
          tar xzf python.tar.gz -C .
          mv python/python/* "$PYTHON_DIR/"
          rm -rf python python.tar.gz

          "$PYTHON_DIR/bin/python3" -m pip install opencv-python-headless numpy --no-warn-script-location
          echo "Intel Python bundled successfully"
          file "$PYTHON_DIR/bin/python3"
        shell: bash

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release
        shell: bash

      - name: Create macOS DMG
        run: |
          APP_PATH="build/Release/LumenArc.app"
          DMG_NAME="LumenArc-${{ github.ref_name }}-mac-intel.dmg"
          hdiutil create -volname "LumenArc" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
        shell: bash

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-release
          path: LumenArc-${{ github.ref_name }}-mac-intel.dmg

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6 via Homebrew
        run: |
          brew install qt@6
          echo "QT6_DIR=$(brew --prefix qt@6)" >> $GITHUB_ENV
        shell: bash

      - name: Install VLC
        run: brew install vlc
        shell: bash

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release
        shell: bash

      - name: Bundle Python (ARM64)
        run: |
          curl -L "https://github.com/astral-sh/python-build-standalone/releases/download/20260602/cpython-3.12.13+20260602-aarch64-apple-darwin-install_only_stripped.tar.gz" -o python.tar.gz

          # Find the correct .app path
          APP_PATH=""
          for p in "build/Release/LumenArc.app" "build/LumenArc.app"; do
            if [ -d "$p" ]; then
              APP_PATH="$p"
              break
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: LumenArc.app not found!"
            find build -name "LumenArc.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          PYTHON_DIR="$APP_PATH/Contents/MacOS/python"
          mkdir -p "$PYTHON_DIR"
          tar xzf python.tar.gz -C .
          mv python/python/* "$PYTHON_DIR/"
          rm -rf python python.tar.gz

          "$PYTHON_DIR/bin/python3" -m pip install opencv-python-headless numpy --no-warn-script-location
          echo "ARM64 Python bundled successfully"
          file "$PYTHON_DIR/bin/python3"
        shell: bash

      - name: Create macOS DMG
        run: |
          APP_PATH=""
          for p in "build/Release/LumenArc.app" "build/LumenArc.app"; do
            if [ -d "$p" ]; then
              APP_PATH="$p"
              break
            fi
          done
          DMG_NAME="LumenArc-${{ github.ref_name }}-mac-arm64.dmg"
          hdiutil create -volname "LumenArc" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
        shell: bash

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: LumenArc-${{ github.ref_name }}-mac-arm64.dmg

  create-release:
    needs: [build-windows, build-macos-intel, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/windows-release/LumenArc-${{ github.ref_name }}-win64.zip
            ./artifacts/macos-intel-release/LumenArc-${{ github.ref_name }}-mac-intel.dmg
            ./artifacts/macos-arm64-release/LumenArc-${{ github.ref_name }}-mac-arm64.dmg
          body: |
            追光者 Lumen Arc v0.2 Beta 首次发布。支持 Windows 和 macOS（Intel + Apple Silicon），内置 Python 分析环境，开箱即用。

            ## 下载说明
            - **Windows**: `LumenArc-v0.2-win64.zip` — 解压后双击 LumenArc.exe 运行
            - **macOS (Intel)**: `LumenArc-v0.2-mac-intel.dmg` — 适用于 2020 年及之前的 Intel 芯片 Mac
            - **macOS (Apple Silicon)**: `LumenArc-v0.2-mac-arm64.dmg` — 适用于 M1/M2/M3/M4 芯片 Mac
          generate_release_notes: false
          draft: false
          prerelease: false
