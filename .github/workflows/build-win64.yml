name: Build Win64

# ─────────────────────────────────────────────────────────────────────────────
# 唯一的 Windows 构建/发行工作流（v1.18.0 合并）
#
# 原先有两条几乎重复的工作流（build-win64.yml 管 master 推入、build.yml 管 tag
# 发行），各含近 200 行必须手工同步的步骤。这份重复本身就是事故来源：
# FFmpeg SDK 下载步骤只在其中一条被放到了正确位置（Configure CMake 之前），
# 另一条没有 → 156 连败、v1.17.0 发行包缺失 win64。故合并为单文件。
#
# 触发：
#   - master 推入      → 全量编译 + 打包 + 产物留档（编译/链接漂移闸门）
#   - tag v*           → 同上，并额外把 zip 挂到 GitHub Release
#   - workflow_dispatch→ 手动
#   ⚠️ 对同一 commit 先推 master 再打 tag 会跑两次（两个事件）；如需只跑一次，
#      可只打 tag（tag 会走完整流程）。
#
# 关键位置约束：
#   CMakeLists.txt 在 **configure 期** 即硬校验 FFmpeg SDK
#   （third_party/ffmpeg/include/libavformat/avformat.h + lib/*.lib，缺失即
#   FATAL_ERROR）。所以 "Download FFmpeg SDK" 必须在 "Configure CMake" **之前**。
#   实锤：run 34459819377 等全部卡在 "CMake Error at CMakeLists.txt:52"。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# tag 构建时把资产挂到 Release 需要写权限
# （build-mac.yml 曾踩 403 "Resource not accessible by integration"，run 34454627119）
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts qtmultimedia'

      - name: Set up Python (tools/pack_release.py、tools/fetch_ffmpeg_cli.py 用)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ★★ 必须在 Configure CMake 之前 ★★
      - name: Download FFmpeg SDK (LGPL shared)
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg-sdk.zip"
          Expand-Archive -Path "ffmpeg-sdk.zip" -DestinationPath "ffmpeg-sdk-temp" -Force
          $inner = Get-ChildItem "ffmpeg-sdk-temp" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path "third_party" -Force | Out-Null
          Move-Item $inner.FullName "third_party\ffmpeg" -Force
          Remove-Item "ffmpeg-sdk.zip", "ffmpeg-sdk-temp" -Recurse -Force
          # 显式校验：缺失会让 CMake configure 直接失败，早点给出可读错误
          if (-not (Test-Path "third_party\ffmpeg\include\libavformat\avformat.h")) {
            Write-Error "FFmpeg SDK 头文件缺失：third_party\ffmpeg\include\libavformat\avformat.h"
            exit 1
          }
          Write-Host "FFmpeg SDK ready: third_party\ffmpeg"
        shell: pwsh

      - name: Configure CMake
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        # 全量编译（app + 25 个无头测试目标）是这条流水线的价值所在：它充当
        # “编译/链接漂移”闸门。v1.18.0 就是靠它抓到 lumenarc_libav_test 漏链
        # 微变符号的 LNK2019（本地习惯只编 app target，永远抓不到）。
        # 4 核 runner 上约 25 分钟，属预期；加 timeout 防挂死。
        timeout-minutes: 90
        run: cmake --build build --config Release
        shell: bash

      # ffmpeg/ffprobe CLI 的唯一来源：脚本会在隔离 cwd + 最小 PATH 下自检
      # “是否自足可运行”，动态链接版（缺 DLL）会被拒绝，不可能落进产物。
      # 旧内联 PowerShell 只按文件名拷贝，正是“静态 ffmpeg.exe + 动态 ffprobe.exe”
      # 混装导致自动校时失效的温床。
      - name: Install ffmpeg CLI (ffmpeg.exe + ffprobe.exe, 自检可运行)
        run: python tools/fetch_ffmpeg_cli.py
        shell: bash

      - name: Bundle Python 3.12 embeddable
        run: |
          $ErrorActionPreference = 'Stop'
          $pyVer = "3.12.8"
          $pyUrl = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
          Write-Host "Downloading Python $pyVer embeddable..."
          Invoke-WebRequest -Uri $pyUrl -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "build\Release\python" -Force
          Remove-Item "python-embed.zip"

          $pthFile = "build\Release\python\python312._pth"
          Set-Content -Path $pthFile -Value "python312.zip`n.`nimport site" -NoNewline

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "build\Release\python\get-pip.py"
          & "build\Release\python\python.exe" "build\Release\python\get-pip.py" --no-warn-script-location
          Remove-Item "build\Release\python\get-pip.py"

          & "build\Release\python\python.exe" -m pip install opencv-python-headless numpy rapidocr_onnxruntime --target "build\Release\python\Lib\site-packages" --no-warn-script-location

          # 清理 pip/setuptools（体积 + 避免残留进包）
          Remove-Item "build\Release\python\Lib\site-packages\pip" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build\Release\python\Lib\site-packages\pip-*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build\Release\python\Lib\site-packages\setuptools*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build\Release\python\Lib\site-packages\_distutils_hack" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build\Release\python\Lib\site-packages\pkg_resources" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Python bundled successfully"
        shell: pwsh

      - name: Stage remaining release inputs
        run: |
          $ErrorActionPreference = 'Stop'
          # vc_redist.x64.exe 是 24MB 二进制、未入 git → 从微软官方拉取。
          # pack_release.py 的 REQUIRED 清单强校验它，缺失即打包失败。
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "build\Release\vc_redist.x64.exe"
          Copy-Item "setup_python_deps.bat" "build\Release\" -Force
          Write-Host "Stage done: vc_redist.x64.exe + setup_python_deps.bat"
        shell: pwsh

      - name: Run engine self-tests
        run: |
          New-Item -ItemType Directory -Path "build\testdata" -Force | Out-Null
          & "build\Release\ffmpeg\ffmpeg.exe" -y -v error -f lavfi -i "testsrc=duration=15:size=640x360:rate=25" -f lavfi -i "sine=frequency=440:duration=15" -c:v libx264 -preset fast -c:a aac "build\testdata\test_clip.mp4"
          & "build\Release\lumenarc_engine_test.exe" seek-matrix "build\testdata\test_clip.mp4"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "build\Release\lumenarc_engine_test.exe" play "build\testdata\test_clip.mp4" 3
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "build\Release\lumenarc_engine_test.exe" audio "build\testdata\test_clip.mp4" 3
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "build\Release\lumenarc_engine_test.exe" step "build\testdata\test_clip.mp4" 10
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh

      # pack_release.py 三道闸门：红线排除 / REQUIRED 必含清单 / 可运行性实跑
      - name: Pack release (tools/pack_release.py)
        id: pack
        run: |
          # 版本号从 CMakeLists.txt 提取（不用 grep -oP：Git Bash 的 -P 受 locale 限制会失败）
          VER=$(sed -n 's/^project(LumenArc VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$VER" ]; then echo "::error::无法从 CMakeLists.txt 解析版本号"; exit 1; fi
          echo "Detected version from CMakeLists.txt: $VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          python tools/pack_release.py "$VER"
        shell: bash

      - name: Verify package matches the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${{ steps.pack.outputs.ver }}"
          TAG="${{ github.ref_name }}"
          ZIP="build_tmp/dist/LumenArc-v${VER}-win64.zip"
          if [ ! -f "$ZIP" ]; then echo "::error::missing $ZIP"; exit 1; fi
          if [ "v${VER}" != "$TAG" ]; then
            echo "::warning::CMakeLists 版本 v${VER} 与 tag ${TAG} 不一致——请确认是有意为之"
          fi
          ls -lh "$ZIP"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumenArc-win64
          path: build_tmp/dist/LumenArc-v*-win64.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_tmp/dist/LumenArc-v*-win64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 下载说明
            - **Windows**：`LumenArc-v<版本>-win64.zip` — 解压后双击 `LumenArc.exe` 运行
              - 解压后目录内已自带 Python 分析环境与 ffmpeg，无需另外安装
              - 若程序提示缺少 `VCRUNTIME140.dll` / `MSVCP140.dll`，双击同目录的
                `vc_redist.x64.exe` 装一次运行库即可（旧版精简系统常见）
            - **macOS**：`LumenArc-mac-arm64.dmg`（Apple Silicon）
